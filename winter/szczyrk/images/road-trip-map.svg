    </pattern>
    <path id="mountain" d="m0 23 20-23 20 23m-27-8 7-8 7 8" fill="none"/>
  </defs>
  <rect width="900" height="480" fill="url(#paper)"/>
  <rect width="900" height="480" fill="url(#grid)"/>
