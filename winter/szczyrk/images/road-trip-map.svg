<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title description">
  <title id="title">Route to Szczyrk via Katowice / Маршрут в Шчирк через Катовице</title>
  <desc id="description">Two people drive from Wrocław and two take a train from Warsaw. All four meet at Katowice railway station and continue by car towards Szczyrk. The map shows intermediate towns, the Odra and Wisła rivers, and approximate travel distances and times.</desc>
